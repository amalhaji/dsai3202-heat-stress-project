# One deployment (pattern from Lab 10 blue.yml). Exact model version, never @latest.
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: ep-heat-change-me            # set on the command line: --endpoint-name $EP
model: azureml:heat-wbgt:1
code_configuration:
  code: ../project
  scoring_script: score.py
environment: azureml:sentiment-inference-env:1   # reused Lab-10 serving image: same packages as training + azureml-inference-server-http
instance_type: Standard_DS2_v2
instance_count: 1
request_settings:
  request_timeout_ms: 10000
  max_concurrent_requests_per_instance: 2
