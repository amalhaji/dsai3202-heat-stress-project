# Training command job (pattern from Lab 8/9): serverless compute, user identity reads the lake.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: train-heat-wbgt
experiment_name: heat-wbgt-phase2
description: Persistence baseline vs Ridge / HistGradientBoosting for next-day max WBGT in Doha (heat-features v1)

code: .
command: >-
  python train.py
  --data ${{inputs.data}}
  --seed ${{inputs.seed}}
  --expected_sha256 ${{inputs.expected_sha256}}
  --git_commit ${{inputs.git_commit}}

inputs:
  data:
    type: uri_folder
    path: azureml:heat-features:1
  seed: 42
  expected_sha256: CHANGE_ME
  git_commit: CHANGE_ME

environment: azureml:sentiment-env:1      # reused Lab-8 training image: python 3.11.9, scikit-learn 1.5.2, pandas 2.2.3, mlflow 2.17.2

identity:
  type: user_identity
